name: 离线工程门禁
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      PAPER_ANALYSIS_DISABLE_PROXY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: bash scripts/run.sh python -m unittest discover -s tests/unit -q
      - run: bash scripts/run.sh python -m unittest discover -s tests/integration -q
      - run: bash scripts/run.sh npm --prefix web ci
      - run: bash scripts/run.sh npm --prefix web run build
      - run: bash scripts/run.sh web/node_modules/.bin/playwright install --with-deps chromium
      - run: bash scripts/run.sh web/node_modules/.bin/playwright test --config web/playwright.config.js
